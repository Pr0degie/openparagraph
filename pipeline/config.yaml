# openparagraph pipeline configuration
# Edit here, not in the Snakefile, so reruns stay reproducible.

jurisdiction: "de-bund"

sources:
  gii_toc: "https://www.gesetze-im-internet.de/gii-toc.xml"
  history_repo: "https://github.com/kmein/gesetze"   # daily-updated git history (~2021+)
  fna_pdf_year: 2023   # update annually; URL pattern: recht.bund.de/.../FNA_{year}.pdf

embeddings:
  model: "distiluse-base-multilingual-cased-v2"
  fields: ["title", "opening_text"]   # what gets embedded per law

orphan_neighbors:
  k: 5
  soft_edge_weight: 0.1

layout:
  seed: 42                 # fixed for reproducible coordinates
  iterations: 2000
  scaling_ratio: 8.0       # was 2.0 — higher = stronger node repulsion, prevents clumping
  gravity: 0.3             # was 1.0 — lower = less pull toward center, allows spreading
  strong_gravity: false
  barnes_hut_theta: 1.2
  outbound_attraction_distribution: true   # dissuade hubs
  adjust_sizes: true       # FA2 accounts for node sizes in repulsion — larger hubs push harder
  # 3D depth axis. dimensions=2 → x/y only (code default). dimensions=3 → also
  # emit a semantic z so the frontend's 2.5D/3D views have meaningful depth.
  dimensions: 3
  z_source: "pca-embeddings"   # z = a principal component of the stage-09 embeddings
  z_scale: 6000.0              # ≈ x/y std, so z spread is comparable to the map
  z_component: 0               # which principal component becomes z

validation:
  min_nodes: 5000
  max_nodes: 8000
  max_orphan_ratio: 0.35   # if more than this share is unclassified, FNA source is broken
